{% extends 'blog/base.html' %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Erick's blog</title>
</head>
<body>
{% block content %}
    {% for post in posts %}
        <article class ="post">
            <time class="date">
                {{post.published_date}}
            </time>
            <h2><a href="{% url 'post_detail' pk=post.pk %}">{{ post.title }}</a></h2>
            <p>{{ post.text }}</p>
        </article>
    {% endfor %}
{% endblock %}
</body>
</html>
